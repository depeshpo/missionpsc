name: CI

# Host-independent checks on every push to main and every PR. Deployment (CD) is
# handled separately by Vercel; this is the portable correctness gate.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Every route is dynamic (nonce CSP forces it), so the build makes no Supabase
      # calls — but the two public NEXT_PUBLIC_* vars are inlined into client bundles,
      # so pass them (from repo secrets, mirroring Vercel) to keep CI faithful to prod.
      # Never add the service-role key here.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
